import java.io.File
import java.nio.file.Files
import java.security.MessageDigest

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 31

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

    dependencies {
        implementation fileTree(dir: "$buildDir/output", include: "*.jar")
    }
}

task downloadDependencies(type: Exec) {
        // Delete previously created /output subdirectory.

        def outputDir = file("$buildDir/output")
        if (outputDir.exists()) {
            outputDir.deleteDir()
        }
        outputDir.mkdirs()

        // Pin immutable GitHub release asset IDs and verify their SHA-256 digests.
        def filesToDownload = [
            ["url": "https://api.github.com/repos/bggRGjQaUbCoE/libmpv-android-video-build/releases/assets/512692511", "sha256": "2c67bc2ebd4d831a6dddf683aee8e7e3da8088a188b3f0185e0a758c8caeff1e", "destination": file("$buildDir/vnext-0bb7758/default-arm64-v8a.jar")],
            ["url": "https://api.github.com/repos/bggRGjQaUbCoE/libmpv-android-video-build/releases/assets/512692515", "sha256": "2ba89da4fb3f208ea6228f0499e7cb7b535bb73b59f6dd86a0ab32498fe42984", "destination": file("$buildDir/vnext-0bb7758/default-armeabi-v7a.jar")],
            ["url": "https://api.github.com/repos/bggRGjQaUbCoE/libmpv-android-video-build/releases/assets/512692510", "sha256": "40a9864988f1bd48301366b2a103c72d7220c13b88d9148e339727369b4758df", "destination": file("$buildDir/vnext-0bb7758/default-x86_64.jar")],
        ]

        def calculateSHA256 = { target ->
            MessageDigest.getInstance("SHA-256").digest(Files.readAllBytes(target.toPath())).encodeHex().toString()
        }

        filesToDownload.each { fileInfo ->
            def destFile = fileInfo.destination
            if (destFile.exists()) {
                def calculatedSHA256 = calculateSHA256(destFile)

                if (calculatedSHA256 != fileInfo.sha256) {
                    destFile.delete()
                    println "SHA-256 mismatch. File deleted: ${destFile}"
                }

            }

            if (!destFile.exists()) {
                destFile.parentFile.mkdirs()
                println "Downloading file from immutable asset: ${fileInfo.url}"
                def connection = new URL(fileInfo.url).openConnection()
                connection.setRequestProperty("Accept", "application/octet-stream")
                connection.setRequestProperty("X-GitHub-Api-Version", "2022-11-28")
                connection.setRequestProperty("User-Agent", "media-kit-gradle")
                connection.setConnectTimeout(30000)
                connection.setReadTimeout(120000)
                connection.inputStream.withCloseable { input ->
                    destFile.withOutputStream { output ->
                        output << input
                    }
                }

                def calculatedSHA256 = calculateSHA256(destFile)
                if (calculatedSHA256 != fileInfo.sha256) {
                    destFile.delete()
                    throw new GradleException(
                        "SHA-256 verification failed for ${destFile}: expected ${fileInfo.sha256}, got ${calculatedSHA256}"
                    )
                }
            }

            copy {
                from destFile
                into outputDir
            }
        }
}

assemble.dependsOn(downloadDependencies)